name: get stock price

on:
  schedule:
    - cron: "*/5 * * * *" 
  workflow_dispatch:  # 加入這一行，開啟手動執行按鈕！

jobs:
  build:
    runs-on: ubuntu-latest
# ... 下面的程式碼維持不變 ...
    steps:
      # 1. 取得儲存庫中的程式碼 (升級至 v4 以避免舊版警告)
      - name: Check out code
        uses: actions/checkout@v4
        
      # 2. 設定 Python 環境 (升級至 v5 以避免舊版警告)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      # 3. 安裝所需套件 (加入 yfinance 與 bs4)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4 yfinance
          
      # 4. 執行您的爬蟲程式 (檔名需與您上傳的 python 檔名一致，例如 test1.py)
      - name: Run python script
        run: python test1.py
